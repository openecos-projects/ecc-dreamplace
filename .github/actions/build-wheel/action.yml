name: Build DreamPlace Wheel
description: Compile C++ operators, build raw wheel, auditwheel repair, smoke test
# Requires: container quay.io/pypa/manylinux_2_34_x86_64 at the job level

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        dnf install -y epel-release
        dnf config-manager --set-enabled crb || true
        dnf install -y \
          cmake ninja-build pkgconfig patchelf \
          boost-devel cairo-devel gflags-devel \
          glog-devel flex flex-devel bison eigen3-devel gtest-devel unzip zip

    - name: Setup Python 3.11
      shell: bash
      run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        version: latest
        enable-cache: true

    - name: Install Python dependencies
      shell: bash
      # Do not trigger an isolated editable build here: build-system's torch
      # requirement is unpinned. The wheel build below uses the locked torch.
      run: uv sync --frozen --all-groups --python 3.11 --no-install-project

    - name: Build and test CPU-only Xplace GPUGR
      shell: bash
      run: |
        ECC_VENV_PYTHON="$PWD/.venv/bin/python" \
          XPLACE_ENABLE_CUDA=OFF \
          JOBS="$(nproc)" \
          ./thirdparty/build_xplace_gpugr.sh

        if ldd thirdparty/xplace/build_cpu_pr/cpp_to_py/gpugr/gpugr*.so \
          | grep -Eqi 'cuda|cublas|cudnn|nccl|nvjit|nvshmem'; then
          echo "CPU-only GPUGR unexpectedly depends on CUDA libraries" >&2
          exit 1
        fi

        .venv/bin/python -m unittest -v \
          dreamplace/unittest_gpugr_backend_select.py \
          thirdparty/xplace/cpp_to_py/gpugr/unittest_cpu_backend_build_guards.py \
          thirdparty/xplace/cpp_to_py/gpugr/unittest_cpu_pattern_route.py \
          thirdparty/xplace/cpp_to_py/gpugr/unittest_portless_io_pin_grnet.py \
          thirdparty/xplace/cpp_to_py/io_parser/unittest_portless_lef_pin.py

    - name: Build repaired wheel
      shell: bash
      run: |
        # --no-build-isolation: the C++ ops must compile against the locked
        # torch (build-system requires would otherwise resolve the latest
        # torch, whose C++ ABI may not match the runtime torch used by ecc).
        uv build --wheel --verbose --no-build-isolation \
          --config-setting=cmake.define.DREAMPLACE_REQUIRE_XPLACE_RUNTIME=ON

        # Torch and CUDA libs excluded from auditwheel repair -- DreamPlace is built with
        # TORCH_ENABLE_CUDA=0 and torch is a runtime dependency (not bundled). Without these
        # exclusions auditwheel would bundle ~2 GB of shared libraries.
        EXCLUDE_LIBS=(
            libtorch.so libtorch_cpu.so libtorch_python.so libc10.so libshm.so
            libgomp.so.1
            # CUDA (not present in CPU build, but excluded as safety net)
            libcudart.so.12 libcublasLt.so.12 libcublas.so.12 libcudnn.so.9
            libcupti.so.12 libnvToolsExt.so.1 libnvrtc.so.12 libcufft.so.11
            libcurand.so.10 libcusparse.so.12 libcusolver.so.11 libnccl.so.2
            libnvJitLink.so.12 libtriton.so
        )
        exclude_flags=()
        for lib in "${EXCLUDE_LIBS[@]}"; do
            exclude_flags+=(--exclude "$lib")
        done

        mkdir -p dist/wheel/repaired
        uv run --no-sync -m auditwheel repair dist/*.whl -w dist/wheel/repaired "${exclude_flags[@]}" --disable-isa-ext-check

    - name: Smoke installed CPU-only GPUGR wheel
      shell: bash
      run: |
        wheel="$(find dist/wheel/repaired -maxdepth 1 -name 'ecc_dreamplace-*.whl' -print -quit)"
        test -n "$wheel"
        uv pip install --python .venv/bin/python --reinstall --no-deps "$wheel"

        repo_root="$PWD"
        cd /tmp
        ECC_XPLACE_ROOT= REPO_ROOT="$repo_root" "$repo_root/.venv/bin/python" - <<'PY'
        import os
        import subprocess
        import sys
        from pathlib import Path
        from types import SimpleNamespace

        from dreamplace.ops.gpugr.xplace_backend import XplaceGPUGR

        operator = XplaceGPUGR(
            SimpleNamespace(lef_input=[], result_dir="/tmp"),
            SimpleNamespace(data_manager=None),
        )
        xplace_root = operator._ensure_xplace_python_path()
        _, gpugr, _, _, _ = operator._import_xplace_modules()
        assert gpugr.cuda_enabled() is False
        assert "site-packages" in str(xplace_root), xplace_root
        env = os.environ.copy()
        env["XPLACE_CPU_RUNTIME_ROOT"] = str(xplace_root)
        test_path = (
            Path(os.environ["REPO_ROOT"])
            / "thirdparty/xplace/cpp_to_py/gpugr/unittest_cpu_pattern_route.py"
        )
        subprocess.run([sys.executable, str(test_path)], check=True, env=env)
        print(f"installed_cpu_gpugr_route_ok root={xplace_root}")
        PY
