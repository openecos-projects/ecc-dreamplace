name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      cuda-tests:
        description: Build and test a CUDA wheel on a GPU runner with CUDA Toolkit installed.
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build wheel
        uses: ./.github/actions/build-wheel

      - name: Upload repaired wheel
        uses: actions/upload-artifact@v4
        with:
          name: ecc-dreamplace-wheel
          path: dist/wheel/repaired/ecc_dreamplace-*.whl
          if-no-files-found: error

  cuda-routability:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda-tests
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Prepare CUDA Torch environment
        run: |
          uv sync --frozen --all-groups --python 3.11 --no-install-project
          uv pip install --python .venv/bin/python 'cmake>=3.24,<4'
          uv pip install --python .venv/bin/python --reinstall \
            torch==2.11.0+cu128 --index-url https://download.pytorch.org/whl/cu128
      - name: Build CUDA wheel
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=4 uv build --wheel --no-build-isolation
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
      - name: Test installed CUDA routability wheel
        run: |
          repo_root="$PWD"
          cd /tmp
          "$repo_root/.venv/bin/python" \
            "$repo_root/unittest/ops/routability_wheel_smoke.py" --cuda

  nix-build:
    name: Nix Build (flake checks)
    runs-on: ubuntu-latest
    # Cold cache builds dreamplace and its native deps from source;
    # magic-nix-cache makes subsequent runs incremental.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          extra-conf: |
            extra-substituters = https://cache.ani.llc
            extra-trusted-public-keys = cache.ani.llc:8nINs8lCCU0Yoed1KMjLj6fCHpMmrY+sFuhGTdxLB88=

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Build all flake checks
        run: nix flake check -L
